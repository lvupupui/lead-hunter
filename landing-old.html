<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 自动化服务 — 让技术为你工作</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#08080e;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:600px;width:100%}
.header{text-align:center;margin-bottom:40px}
.header h1{font-size:2rem;color:#fff;margin-bottom:10px}
.header p{color:#888;font-size:0.95rem}
.badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.badge{background:#1a1a2e;border:1px solid #333;padding:6px 14px;border-radius:20px;font-size:0.8rem;color:#aaa}
.card{background:#111118;border:1px solid #222;border-radius:12px;padding:30px;margin-bottom:20px}
.card h2{font-size:1.1rem;color:#fff;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:0.85rem;color:#999;margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;background:#0a0a10;border:1px solid #333;border-radius:8px;color:#fff;font-size:0.95rem;outline:none;transition:border .2s}
.form-group input:focus,.form-group textarea:focus{border-color:#6366f1}
.form-group textarea{min-height:100px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:14px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;transition:background .2s,transform .1s}
.btn:hover{background:#5558e6}
.btn:active{transform:scale(0.98)}
.btn:disabled{background:#333;cursor:not-allowed}
.success{display:none;text-align:center;padding:40px 20px}
.success h3{color:#4ade80;font-size:1.3rem;margin-bottom:10px}
.success p{color:#888}
.contact{margin-top:20px;text-align:center;color:#666;font-size:0.85rem}
.contact a{color:#6366f1;text-decoration:none}
@media(max-width:480px){
  .form-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🚀 AI 自动化服务</h1>
    <p>Python · Web · 爬虫 · 工作流 · API 集成</p>
  </div>

  <div class="badges">
    <span class="badge">AI Agent 开发</span>
    <span class="badge">自动化工作流</span>
    <span class="badge">Web 全栈</span>
    <span class="badge">数据采集</span>
    <span class="badge">API 对接</span>
    <span class="badge">n8n/Make</span>
  </div>

  <div class="card" id="formCard">
    <h2>📩 描述你的需求，24小时内回复</h2>
    <form id="leadForm">
      <div class="form-row">
        <div class="form-group">
          <label>你的名字</label>
          <input type="text" name="name" required placeholder="张三">
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" name="email" required placeholder="you@example.com">
        </div>
      </div>
      <div class="form-group">
        <label>项目类型</label>
        <select name="type">
          <option value="">请选择...</option>
          <option>AI Agent / 智能体</option>
          <option>自动化工作流（n8n/Make）</option>
          <option>Web 开发（全栈）</option>
          <option>数据采集 / 爬虫</option>
          <option>API 集成 / 对接</option>
          <option>微信机器人</option>
          <option>其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>项目简述</label>
        <textarea name="description" required placeholder="简单说说你要做什么，预算大概多少..."></textarea>
      </div>
      <button type="submit" class="btn" id="submitBtn">提交需求</button>
    </form>
  </div>

  <div class="success" id="successMsg">
    <h3>✅ 已收到！</h3>
    <p>我会在 24 小时内回复你。</p>
  </div>

  <div class="contact">
    或直接发邮件：<a href="mailto:leolijinwxy@gmail.com">leolijinwxy@gmail.com</a>
  </div>
</div>

<script>
document.getElementById('leadForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  const formData = new FormData(this);
  const data = Object.fromEntries(formData);

  // 通过 Formspree 免费中转（无需后端）
  try {
    const resp = await fetch('https://formspree.io/f/leolijinwxy@gmail.com', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    if (resp.ok) {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      throw new Error('Failed');
    }
  } catch(err) {
    // fallback: mailto
    const body = `项目类型: ${data.type}%0D%0A%0D%0A${data.description}`;
    window.location.href = `mailto:leolijinwxy@gmail.com?subject=项目需求 - ${data.name}&body=${body}`;
    document.getElementById('formCard').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  }
});
</script>

</body>
</html>
